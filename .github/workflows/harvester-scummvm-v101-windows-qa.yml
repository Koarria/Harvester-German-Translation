name: Harvester ScummVM Deutsch v1.0.1 - Windows build and QA
on:
  push:
    branches:
      - 'fix/scummvm-relocated-gog-paths'
      - main
    paths:
      - 'source/tools/developer/scummvm_converter.py'
      - 'source/tools/developer/scummvm_converter_gui.py'
      - 'source/tools/developer/test_scummvm_converter.py'
      - 'source/runtime/harvester_iso.py'
      - 'release/SCUMMVM_LIES_MICH_v1.0.1.txt'
      - 'release/SCUMMVM_RELEASE_NOTES_v1.0.1.md'
      - '.github/workflows/harvester-scummvm-v101-windows-qa.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: harvester-scummvm-hotfix-v101-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-scummvm-hotfix:
    runs-on: windows-latest
    timeout-minutes: 65
    steps:
      - name: Checkout public sources
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.13 (Windows build runner)
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify original public translation XML hashes
        shell: pwsh
        run: |
          $expect = @{
            'resources/payload/Regeln.xml' = '7c72b55366546080544d603fbe4f24aa128d80c043a56cad36db4db40327266b'
            'resources/payload/VideoManifest.xml' = 'f56a5708018820bcbc6af0c6fb71f3f775a39b317bd1626eb898aa04aaf7162d'
          }
          foreach ($item in $expect.GetEnumerator()) {
            $got=(Get-FileHash -Algorithm SHA256 -LiteralPath $item.Key).Hash.ToLowerInvariant()
            if ($got -cne $item.Value) { throw "STOP: altered original translation XML $($item.Key)" }
          }
          Write-Host 'PASS: Exact original tested translation XML inputs.'
      - name: Audit release labels, source syntax and required safety checks
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import ast,re
          src=Path('source/tools/developer')
          gui=(src/'scummvm_converter_gui.py').read_text('utf-8')
          core=(src/'scummvm_converter.py').read_text('utf-8')
          for file in ('scummvm_converter.py','scummvm_converter_gui.py','test_scummvm_converter.py'):
              ast.parse((src/file).read_text('utf-8'), filename=file)
          forbidden=(r'Testversion',r'Versuchsfassung',r'Experimenteller Konverter',r'INGAME-TEST NOCH OFFEN',r'SCUMMVM_DEUTSCH_TEST_HINWEISE')
          if any(re.search(p,core+'\n'+gui,re.I) for p in forbidden):
              raise SystemExit('STOP: unwanted testing labels in public converter/GUI')
          for required in ('verified_local_render_hashes','ALTER_FIX2_STARTER.txt','LOKALE_RENDER_QA.json','VIDEO_MANIFEST_SHA256','ISO_FILE_COUNTS'):
              if required not in core: raise SystemExit('STOP: safety preflight missing: '+required)
          if 'SCUMMVM_DEUTSCH_HINWEISE.txt' not in core:
              raise SystemExit('STOP: final generated player instructions missing')
          for name in ('release/SCUMMVM_LIES_MICH_v1.0.1.txt','release/SCUMMVM_EINSTELLUNGEN.txt'):
              content=Path(name).read_text('utf-8')
              if re.search(r'Testversion|Versuchsfassung|\bTEST\b',content,re.I):
                  raise SystemExit('STOP: testing wording in public release document '+name)
          print('PASS: safe release labels, public source syntax and pinned security logic')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run all converter regression tests (including relocated installs)
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}\source
        run: |
          python -m unittest discover -s source/tools/developer -p test_scummvm_converter.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host 'PASS: fail-closed ISO, double XML starter, video SHA, save safety tests'
      - name: Install pinned public Python build dependencies
        shell: pwsh
        run: |
          python -m pip install -r source/requirements-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build standalone Windows German ScummVM converter
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name Harvester_ScummVM_Deutsch_Konverter --paths source --paths source/tools/developer --add-data "resources/payload/Regeln.xml;payload" --add-data "resources/payload/VideoManifest.xml;payload" source/tools/developer/scummvm_converter_gui.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe='dist/Harvester_ScummVM_Deutsch_Konverter.exe'
          if (-not (Test-Path $exe -PathType Leaf)) { throw 'STOP: standalone EXE missing' }
          & "./$exe" --selftest
          if ($LASTEXITCODE -ne 0) { throw 'STOP: frozen EXE selftest failed' }
          $listing = python -m PyInstaller.utils.cliutils.archive_viewer -l -r $exe
          if ($LASTEXITCODE -ne 0) { throw 'STOP: cannot inspect EXE contents' }
          foreach($s in @('scummvm_converter','harvester_iso')) {
            if (-not ($listing | Select-String -SimpleMatch $s)) { throw "STOP: missing internal module $s" }
          }
          if ($listing | Select-String -Pattern 'private_delta[/\\]|resources[/\\]delta[/\\]|payload[/\\]subtitles|payload[/\\]Daten|Harvester_Deutsch_Patcher[.]exe') {
            throw 'STOP: private Delta, original game data or other games embedded'
          }
          Write-Host 'PASS: one-file converter without Python, Delta or original game files'
      - name: Create and independently audit final clean 4-file player ZIP
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          from hashlib import sha256
          from zipfile import ZipFile, ZIP_DEFLATED
          import re
          exe=Path('dist/Harvester_ScummVM_Deutsch_Konverter.exe')
          if not exe.is_file() or exe.stat().st_size < 1_000_000:
              raise SystemExit('STOP: invalid frozen Windows converter')
          digest=sha256(exe.read_bytes()).hexdigest()
          name='Harvester_ScummVM_Deutsch_Konverter_v1.0.1.zip'
          readme=Path('release/SCUMMVM_LIES_MICH_v1.0.1.txt').read_bytes()
          cfg=Path('release/SCUMMVM_EINSTELLUNGEN.txt').read_bytes()
          allowed={
              'Harvester_ScummVM_Deutsch_Konverter.exe':exe.read_bytes(),
              'LIES_MICH_SCUMMVM.txt':readme,
              'SCUMMVM_EINSTELLUNGEN.txt':cfg,
              'SHA256SUMS.txt':(digest+'  Harvester_ScummVM_Deutsch_Konverter.exe\n').encode('ascii'),
          }
          if any(re.search(r'Testversion|Versuchsfassung',v.decode('utf-8'),re.I) for k,v in allowed.items() if k.endswith('.txt')):
              raise SystemExit('STOP: final documentation contains test label')
          with ZipFile(name,'w',compression=ZIP_DEFLATED,compresslevel=9) as out:
              for file,content in allowed.items():
                  out.writestr(file,content)
          with ZipFile(name) as actual:
              if set(actual.namelist())!=set(allowed) or len(actual.namelist())!=4:
                  raise SystemExit('STOP: unexpected ZIP contents')
              for f,body in allowed.items():
                  if actual.read(f)!=body:
                      raise SystemExit('STOP: ZIP file contents changed: '+f)
          print('PASS: final ScummVM v1.0.1 ZIP contains exactly 4 player-facing files.')
          print('Windows EXE SHA-256:',digest)
          print('Final ZIP SHA-256:',sha256(Path(name).read_bytes()).hexdigest())
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows ZIP for real-game confirmation
        uses: actions/upload-artifact@v4
        with:
          name: Harvester-ScummVM-Deutsch-v1.0.1-Windows
          path: Harvester_ScummVM_Deutsch_Konverter_v1.0.1.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
  publish-scummvm-v101:
    name: Publish standalone ScummVM v1.0.1 release
    needs: windows-scummvm-hotfix
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout exact tested revision and public release notes
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download the QA-approved Windows player package
        uses: actions/download-artifact@v4
        with:
          name: Harvester-ScummVM-Deutsch-v1.0.1-Windows
          path: packaged
      - name: Independently audit executable, checksum, and package entries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          from zipfile import ZipFile
          file=Path("packaged/Harvester_ScummVM_Deutsch_Konverter_v1.0.1.zip")
          if not file.is_file(): raise SystemExit("STOP: Tested Windows ZIP not found")
          expected={'Harvester_ScummVM_Deutsch_Konverter.exe','LIES_MICH_SCUMMVM.txt','SCUMMVM_EINSTELLUNGEN.txt','SHA256SUMS.txt'}
          with ZipFile(file) as z:
              if set(z.namelist()) != expected or len(z.namelist()) != len(expected):
                  raise SystemExit("STOP: unexpected package entries")
              data=z.read('Harvester_ScummVM_Deutsch_Konverter.exe')
              declared=z.read('SHA256SUMS.txt').decode('ascii').strip()
              expected_line=sha256(data).hexdigest()+'  Harvester_ScummVM_Deutsch_Konverter.exe'
              if declared!=expected_line: raise SystemExit("STOP: executable checksum mismatch")
              if len(data)<1_000_000: raise SystemExit("STOP: invalid Windows executable")
          print("PASS: Windows player ZIP",sha256(file.read_bytes()).hexdigest())
          print("PASS: executable SHA256",sha256(data).hexdigest())
          PY
      - name: Create ScummVM-only release without modifying v1.0.0
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset="packaged/Harvester_ScummVM_Deutsch_Konverter_v1.0.1.zip"
          for old in Harvester_GOG_Deutsch_v1.0.0.zip Harvester_GOG_Deutsch_Source_v1.0.0.zip Harvester_GOG_Deutsch_Resources_v1.0.0.zip Harvester_ScummVM_Deutsch_Konverter_v1.0.0.zip; do
            gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx "$old"
          done
          if gh release view v1.0.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            mkdir -p prior_v101
            gh release download v1.0.1 --repo "$GITHUB_REPOSITORY" --pattern 'Harvester_ScummVM_Deutsch_Konverter_v1.0.1.zip' --dir prior_v101
            cmp -s "$asset" prior_v101/Harvester_ScummVM_Deutsch_Konverter_v1.0.1.zip || { echo "STOP: existing v1.0.1 asset differs; never clobber"; exit 1; }
            echo 'PASS: previously published v1.0.1 has identical bytes'
          else
            gh release create v1.0.1 "$asset" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Harvester – Deutsche Fanübersetzung für ScummVM v1.0.1" --notes-file release/SCUMMVM_RELEASE_NOTES_v1.0.1.md
          fi
          gh release view v1.0.1 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx 'Harvester_ScummVM_Deutsch_Konverter_v1.0.1.zip'
          gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx 'Harvester_GOG_Deutsch_v1.0.0.zip'
          echo 'PASS: standalone ScummVM v1.0.1 published, GOG v1.0.0 remains'
