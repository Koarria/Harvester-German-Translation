name: Harvester - verify unified release and retire obsolete ScummVM ZIP
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/unify-gog-scummvm-release.yml'
      - 'release/RELEASE_NOTES_GEMEINSAM.md'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: harvester-v1-release-asset-updates
  cancel-in-progress: false
jobs:
  cleanup-obsolete-scummvm-asset:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the current release notes
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Lock and verify all four supported downloads
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.0.0" > "$RUNNER_TEMP/release_before.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          release=json.loads((Path(os.environ["RUNNER_TEMP"])/"release_before.json").read_text())
          if release["tag_name"]!="v1.0.0":
              raise SystemExit("STOP: wrong release tag")
          required={
            "Harvester_GOG_Deutsch_v1.0.0.zip":"sha256:0135d48708a11635f66d315d7af88bf63ad15f3aba59346e1e0b9acb7c0146f8",
            "Harvester_GOG_Deutsch_Source_v1.0.0.zip":"sha256:14fb36f59765622bd7d72c9eabd9c93ea2c1d36de1d0f114103f4acf569fda43",
            "Harvester_GOG_Deutsch_Resources_v1.0.0.zip":"sha256:b74d3b3b028d5075f681c756128f83d0c5aa156a8d25437391104d23681dcc39",
            "Harvester_ScummVM_Deutsch_Konverter_v1.0.1.zip":"sha256:d94f8c87cd7b13ffcee66ff0c95decf118dde87d1a0ad60611b8b84f3c5901c2",
          }
          seen={row["name"]:row for row in release["assets"]}
          if len(seen)!=len(release["assets"]):
              raise SystemExit("STOP: duplicate release asset names")
          for name,digest in required.items():
              if name not in seen or seen[name].get("digest")!=digest:
                  raise SystemExit("STOP: expected protected asset absent or changed: "+name)
          outdated=seen.get("Harvester_ScummVM_Deutsch_Konverter_v1.0.0.zip")
          if outdated and (outdated["id"]!=771080952 or outdated.get("digest")!="sha256:d603e9dbcc0f6b5e7e11d2832a053b6984b1ce539bc19093a6c19bdd0da17dd4"):
              raise SystemExit("STOP: obsolete ScummVM asset identity does not match exact approved file")
          print("PASS: Four supported downloads and optional exact obsolete asset verified.")
          PY
      - name: Delete only the superseded ScummVM v1.0.0 player ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          old_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.0.0" --jq '[.assets[] | select(.name == "Harvester_ScummVM_Deutsch_Konverter_v1.0.0.zip") | .id] | .[0] // empty')
          if [[ -n "$old_id" ]]; then
            if [[ "$old_id" != "771080952" ]]; then
              echo 'STOP: obsolete asset ID changed; no deletion'
              exit 1
            fi
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old_id"
            echo 'PASS: Only old ScummVM v1.0.0 ZIP removed from the shared release.'
          else
            echo 'PASS: Old ScummVM v1.0.0 ZIP already absent.'
          fi
      - name: Publish the shared release notes and title
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit v1.0.0 --repo "$GITHUB_REPOSITORY" --title "Harvester - Deutsche Fanübersetzung (GOG v1.0.0 + ScummVM v1.0.1)" --notes-file release/RELEASE_NOTES_GEMEINSAM.md
      - name: Confirm exactly four supported ZIPs remain unchanged
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.0.0" > "$RUNNER_TEMP/release_after.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])
          before=json.loads((p/"release_before.json").read_text())
          after=json.loads((p/"release_after.json").read_text())
          protected={
            "Harvester_GOG_Deutsch_v1.0.0.zip",
            "Harvester_GOG_Deutsch_Source_v1.0.0.zip",
            "Harvester_GOG_Deutsch_Resources_v1.0.0.zip",
            "Harvester_ScummVM_Deutsch_Konverter_v1.0.1.zip"
          }
          old={row["name"]:(row["id"],row["size"],row.get("digest")) for row in before["assets"]}
          now={row["name"]:(row["id"],row["size"],row.get("digest")) for row in after["assets"]}
          if set(now)!=protected:
              raise SystemExit("STOP: unexpected ZIP remains or supported ZIP missing: "+str(set(now)))
          for name in sorted(protected):
              if now.get(name)!=old.get(name):
                  raise SystemExit("STOP: supported ZIP changed: "+name)
          if "ältere Datei im Archiv" in after["body"]:
              raise SystemExit("STOP: obsolete file still mentioned as downloadable")
          if "11 px ist vorausgewählt" not in after["body"]:
              raise SystemExit("STOP: release notes lost current ScummVM instructions")
          print("PASS: Exactly 4 original/current assets retained with unchanged IDs, sizes and checksums.")
          PY
